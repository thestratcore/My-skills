# ops/compose.production.yml - app + worker + one-off migration job.
# Run by release.py with --project-directory <deployDir>, so env_file paths are relative to deployDir.
# Secrets come ONLY via env_file. Never put ${SECRET} interpolation in `environment:` -
# it would be resolved into the captured rollback model.
name: PROJECT
x-runtime: &runtime
  image: ${RELEASE_IMAGE_APP:?Set the reviewed immutable image digest}
  env_file: [.env.production]
  environment:
    NODE_ENV: production
    TZ: Europe/Prague
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  networks: [client-db-net]
  logging:
    driver: local
    options: {max-size: "5m", max-file: "3"}

services:
  PROJECT-app:
    <<: *runtime
    container_name: PROJECT-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:HOST_PORT:3000"     # or remove and join Caddy's network instead (port.host = null)
    mem_limit: 512m

  PROJECT-worker:                      # delete if the project has no worker
    <<: *runtime
    container_name: PROJECT-worker
    restart: unless-stopped
    command: ["node", "worker.js"]
    healthcheck: {disable: true}       # image HEALTHCHECK probes HTTP; a worker has none
    volumes:
      - data:/data                     # declare in release-config services.<name>.mounts
    mem_limit: 256m

  PROJECT-migrate:                     # never started by `up`; release.py migrate runs it
    <<: *runtime
    profiles: [migrate]
    command: ["node", "scripts/migrate.js"]
    healthcheck: {disable: true}
    restart: "no"

volumes:
  data: {}

networks:
  client-db-net:
    external: true
