# ops/compose.production.yml - static site. No build section: the VPS only runs reviewed digests.
name: PROJECT
services:
  PROJECT:
    image: ${RELEASE_IMAGE_WEB:?Set the reviewed immutable image digest}
    container_name: PROJECT
    restart: unless-stopped
    ports:
      - "127.0.0.1:HOST_PORT:8080"     # loopback only; reserve HOST_PORT in references/vps-facts.md
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    cpus: "0.5"
    logging:
      driver: local
      options: {max-size: "1m", max-file: "3"}
