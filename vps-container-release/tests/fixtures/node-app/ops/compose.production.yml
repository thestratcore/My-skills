name: fixture-node
x-runtime: &runtime
  image: ${RELEASE_IMAGE_APP:?Set the reviewed immutable image digest}
  env_file: [.env.production]
  read_only: true
  tmpfs: ["/tmp:rw,noexec,nosuid,size=16m,mode=1777"]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  networks: [client-db-net]
  volumes: ["data:/data"]
services:
  fixture-node-app:
    <<: *runtime
    container_name: fixture-node-app
    restart: unless-stopped
    ports: ["127.0.0.1:13010:3000"]
  fixture-node-worker:
    <<: *runtime
    container_name: fixture-node-worker
    restart: unless-stopped
    command: ["node", "worker.js"]
    healthcheck: {disable: true}
  fixture-node-migrate:
    <<: *runtime
    profiles: [migrate]
    command: ["node", "scripts/migrate.js"]
    healthcheck: {disable: true}
    restart: "no"
volumes:
  data: {}
networks:
  client-db-net:
    external: true
