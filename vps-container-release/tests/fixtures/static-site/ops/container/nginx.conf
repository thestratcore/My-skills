# Plain HTTP on 8080; TLS belongs to Caddy on the VPS.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    # Only if buildMetadata is enabled: build identity must never be cached.
    location = /version.json { add_header Cache-Control "no-store" always; try_files $uri =404; }

    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable" always; try_files $uri =404; }
    location ~ /\. { return 404; }
    location / { add_header Cache-Control "no-cache" always; try_files $uri $uri/ /index.html; }
}
